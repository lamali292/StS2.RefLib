name: Release RefLib

# "Press the release button" = publish a GitHub Release.
# The tag becomes the package version (v0.2.0 -> 0.2.0).
on:
  release:
    types: [published]
  workflow_dispatch:          # also lets you run it manually from the Actions tab
    inputs:
      version:
        description: "Package version (e.g. 0.2.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # No game on the runner: this packs the committed refs/ stubs.
      - name: Pack
        run: dotnet pack RefLib.csproj -c Release -p:Version=${{ steps.ver.outputs.version }} -o artifacts

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          -k ${{ secrets.NUGET_API_KEY }}
          -s https://api.nuget.org/v3/index.json
          --skip-duplicate